<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Blobio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("blobio-dark");
        var q = new URLSearchParams(location.search).get("dark");
        var dark =
          q === "1" ||
          (q !== "0" && (saved === "1" || (saved === null && matchMedia("(prefers-color-scheme: dark)").matches)));
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%233a6f8c'/></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span class="icon-moon" aria-hidden="true">☾</span>
      <span class="icon-sun" aria-hidden="true">☀</span>
    </button>

    <aside id="hall" class="hall-board">
      <h3>All-time top · accounts</h3>
      <ol id="hall-list">
        <li class="hall-empty">Loading…</li>
      </ol>
    </aside>

    <div id="hud" class="hidden">
      <aside id="leaderboard">
        <h2>Leaderboard</h2>
        <ol id="lb-list"></ol>
      </aside>
      <div id="scorebox">
        <span class="score-label">Score</span>
        <span id="score">0</span>
      </div>
      <button type="button" id="btn-exit" aria-label="Exit and die">Exit</button>
      <div id="hud-net" class="net-pill">Connecting</div>
      <canvas id="minimap" width="168" height="168"></canvas>
      <div id="mobile-controls">
        <button type="button" id="btn-eject" aria-label="Eject mass">W</button>
        <button type="button" id="btn-split" aria-label="Split">Split</button>
      </div>
    </div>

    <div id="menu" class="overlay">
      <div class="menu-shell">
        <div class="menu-brand">
          <p class="menu-kicker">online arena</p>
          <h1>Blobio</h1>
          <p class="tag">Eat. Grow. Hunt the map.</p>
        </div>

        <div class="menu-form">
          <div id="menu-net" class="net-pill menu-net">Connecting…</div>

          <button type="button" id="google-btn" class="google-btn">
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            <span>Continue with Google</span>
          </button>

          <div id="auth-user" class="auth-user hidden">
            <img id="auth-avatar" class="auth-avatar" alt="" width="28" height="28" />
            <div class="auth-meta">
              <span id="auth-name" class="auth-name"></span>
              <span id="auth-level" class="auth-level">Lv 1</span>
            </div>
            <button type="button" id="auth-signout" class="auth-signout">Sign out</button>
          </div>

          <input id="nick" maxlength="16" placeholder="Nickname" autocomplete="off" spellcheck="false" />
          <div id="colors" class="colors"></div>
          <div class="skin-row">
            <label class="skin-btn" for="skin-file">Upload skin</label>
            <input id="skin-file" type="file" accept="image/*" hidden />
            <button type="button" id="skin-clear" class="skin-clear hidden">Clear</button>
            <canvas id="skin-preview" class="skin-preview hidden" width="40" height="40" aria-hidden="true"></canvas>
          </div>
          <button type="button" id="play">Play</button>
          <p class="best">Best <span id="best-score">0</span> · Lv <span id="level-score">1</span> · Glory <span id="glory-score">0</span></p>
          <div class="help">
            <span><kbd>Mouse</kbd> move</span>
            <span><kbd>Space</kbd> split</span>
            <span><kbd>W</kbd> eject</span>
            <span><kbd>Esc</kbd> exit</span>
          </div>
        </div>
      </div>
    </div>

    <div id="death" class="overlay hidden">
      <div class="menu-shell death-shell">
        <h2 id="death-title">Eaten</h2>
        <p class="tag">Score <strong id="death-score">0</strong> · Best <span id="death-best">0</span> · Lv <span id="death-level">1</span></p>
        <button type="button" id="again">Play again</button>
        <button type="button" id="home" class="ghost">Main menu</button>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="game.js"></script>
  </body>
</html>
